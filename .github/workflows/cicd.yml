
name: CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        default: patch
        options:
          - auto
          - patch
          - minor
          - major
          - recover

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PYTHON_VERSION: "3.14"

jobs:

  # ----------------------------------------
  # 1. LINT + TESTS
  # ----------------------------------------
  quality:
    name: Lint and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Validate manual branch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Manual releases must run from main"
          exit 1

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Unit tests
        run: python -m pytest -q

  # ----------------------------------------
  # 2. DOCKER CHECK FOR PR / DEVELOP
  # ----------------------------------------
  docker-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: quality

    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Test Docker build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------
  # 3. VERSION + GHCR + GITHUB RELEASE
  # ----------------------------------------
  publish:
    name: Version and Publish
    runs-on: ubuntu-latest
    needs: quality

    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify tested commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git fetch origin main --tags

          # Only release the commit that passed CI.
          git reset --hard "$EXPECTED_SHA"

          REMOTE_SHA="$(git rev-parse origin/main)"

          if [[ "$REMOTE_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::main changed since CI started. Run CI again on the latest commit."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Semantic Release
        if: inputs.release_type != 'recover'
        run: |
          python -m pip install "python-semantic-release==10.5.3"

      - name: Determine release policy
        id: policy
        shell: bash
        env:
          REQUESTED_TYPE: ${{ inputs.release_type || 'auto' }}
        run: |
          set -euo pipefail

          FORCE=""
          SKIP="false"
          RECOVER="false"

          if [[ "$REQUESTED_TYPE" == "recover" ]]; then
            RECOVER="true"

          elif [[ "$REQUESTED_TYPE" != "auto" ]]; then
            FORCE="$REQUESTED_TYPE"

          else
            LAST_TAG="$(
              git describe --tags --match 'v[0-9]*' \
                --abbrev=0 2>/dev/null || true
            )"

            # No new commits: no automatic release.
            if [[ -n "$LAST_TAG" ]] && \
               [[ "$(git rev-list "${LAST_TAG}..HEAD" --count)" -eq 0 ]]; then
              SKIP="true"
            else
              CURRENT="$(semantic-release version --print-last-released)"
              NEXT="$(semantic-release version --print)"

              # Conventional commits decide the release
              # level. Unknown commits get a patch bump.
              if [[ "$NEXT" == "$CURRENT" ]]; then
                FORCE="patch"
              fi
            fi
          fi

          echo "force=$FORCE" >> "$GITHUB_OUTPUT"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "recover=$RECOVER" >> "$GITHUB_OUTPUT"

          echo "Requested: $REQUESTED_TYPE"
          echo "Forced bump: ${FORCE:-automatic}"
          echo "Skip: $SKIP"
          echo "Recover: $RECOVER"

      # Version, changelog, commit and tag are
      # prepared locally. Nothing is pushed yet.
      - name: Prepare Semantic Release
        id: semantic
        if: >-
          steps.policy.outputs.skip != 'true' &&
          steps.policy.outputs.recover != 'true'
        uses: python-semantic-release/python-semantic-release@350c48fcb3ffcdfd2e0a235206bc2ecea6b69df0 # v10.5.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force: ${{ steps.policy.outputs.force }}
          build: "false"
          changelog: "true"
          commit: "true"
          tag: "true"
          push: "false"
          vcs_release: "false"
          git_committer_name: "github-actions[bot]"
          git_committer_email: "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve release target
        id: target
        if: steps.policy.outputs.skip != 'true'
        shell: bash
        env:
          RECOVER: ${{ steps.policy.outputs.recover }}
          RELEASED: ${{ steps.semantic.outputs.released }}
          SEMANTIC_VERSION: ${{ steps.semantic.outputs.version }}
          SEMANTIC_TAG: ${{ steps.semantic.outputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$RECOVER" == "true" ]]; then
            TAG="$(
              git tag --list 'v[0-9]*' \
                --sort=-version:refname | head -n 1
            )"

            if [[ -z "$TAG" ]]; then
              echo "::error::No existing release tag found"
              exit 1
            fi

            git checkout --detach "$TAG"
            VERSION="${TAG#v}"

          else
            if [[ "$RELEASED" != "true" ]]; then
              echo "::error::Semantic Release did not prepare a new version"
              exit 1
            fi

            VERSION="$SEMANTIC_VERSION"
            TAG="$SEMANTIC_TAG"
          fi

          COMMIT="$(git rev-parse HEAD)"
          TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"

          if [[ "$COMMIT" != "$TAG_COMMIT" ]]; then
            echo "::error::Release tag does not match checkout"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          echo "Release: $TAG"
          echo "Commit: $COMMIT"

      # ----------------------------------------
      # 4. MULTI-ARCHITECTURE DOCKER BUILD
      # ----------------------------------------
      - name: Setup QEMU
        if: steps.policy.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v4

      - name: Setup Buildx
        if: steps.policy.outputs.skip != 'true'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Login to GHCR
        if: steps.policy.outputs.skip != 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing recovery image
        id: existing
        if: steps.policy.outputs.recover == 'true'
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail

          if docker buildx imagetools inspect \
              "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Existing versioned image found"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Image missing; rebuilding from release tag"
          fi

      - name: Build and push versioned image
        id: docker
        if: >-
          steps.policy.outputs.skip != 'true' &&
          (
            steps.policy.outputs.recover != 'true' ||
            steps.existing.outputs.found != 'true'
          )
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.target.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ steps.target.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.target.outputs.version }}
            org.opencontainers.image.revision=${{ steps.target.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------
      # 5. VERIFY GHCR BEFORE GIT PUBLICATION
      # ----------------------------------------
      - name: Verify published image
        id: verify
        if: steps.policy.outputs.skip != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail

          IMAGE_REF="$IMAGE:$VERSION"

          docker buildx imagetools inspect \
            --raw "$IMAGE_REF" > manifest.json

          # Require both architectures.
          jq -e '
            [.manifests[]? |
              select(
                .platform.os == "linux" and
                .platform.architecture == "amd64"
              )
            ] | length > 0
          ' manifest.json > /dev/null

          jq -e '
            [.manifests[]? |
              select(
                .platform.os == "linux" and
                .platform.architecture == "arm64"
              )
            ] | length > 0
          ' manifest.json > /dev/null

          DIGEST="$(
            docker buildx imagetools inspect "$IMAGE_REF" |
              awk '/^Digest:/ { print $2; exit }'
          )"

          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Could not verify image digest"
            exit 1
          fi

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

          echo "Image verified: $IMAGE_REF"
          echo "Architectures: linux/amd64, linux/arm64"
          echo "Digest: $DIGEST"

      # ----------------------------------------
      # 6. PUBLISH GIT COMMIT AND VERSION TAG
      # ----------------------------------------
      - name: Push release commit and tag
        if: >-
          steps.policy.outputs.skip != 'true' &&
          steps.policy.outputs.recover != 'true'
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail

          git fetch origin main

          if [[ "$(git rev-parse origin/main)" != "$EXPECTED_SHA" ]]; then
            echo "::error::main advanced during Docker build"
            exit 1
          fi

          # Commit and tag must be accepted together.
          git push --atomic origin \
            HEAD:refs/heads/main \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

      # ----------------------------------------
      # 7. PROMOTE SUCCESSFUL VERSION TO LATEST
      # ----------------------------------------
      - name: Update latest tag
        if: steps.policy.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            "$IMAGE:$VERSION"

          docker buildx imagetools inspect "$IMAGE:latest"

      # ----------------------------------------
      # 8. CREATE GITHUB RELEASE
      # ----------------------------------------
      - name: Publish GitHub Release
        if: steps.policy.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.target.outputs.version }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
          RELEASE_NOTES: ${{ steps.semantic.outputs.release_notes }}
          DIGEST: ${{ steps.verify.outputs.digest }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "GitHub Release already exists: $RELEASE_TAG"
            exit 0
          fi

          if [[ -n "$RELEASE_NOTES" ]]; then
            printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          else
            printf '# %s\n\nRecovered release.\n' \
              "$RELEASE_TAG" > release-notes.md
          fi

          cat >> release-notes.md <<EOF

          ## Docker image

          \`$IMAGE:$VERSION\`

          \`$IMAGE:latest\`

          **Platforms:** linux/amd64, linux/arm64

          **Digest:** \`$DIGEST\`
          EOF

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md

      # ----------------------------------------
      # 9. GITHUB ACTIONS SUMMARY
      # ----------------------------------------
      - name: Release summary
        if: steps.policy.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.target.outputs.version }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
          DIGEST: ${{ steps.verify.outputs.digest }}
        run: |
          {
            echo "## Docker release: $RELEASE_TAG"
            echo ""
            echo "**Image:** \`$IMAGE:$VERSION\`"
            echo ""
            echo "**Latest:** \`$IMAGE:latest\`"
            echo ""
            echo "**Platforms:** amd64, arm64"
            echo ""
            echo "**Digest:** \`$DIGEST\`"
            echo ""
            echo "GitHub Release and GHCR publication completed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: No release summary
        if: steps.policy.outputs.skip == 'true'
        run: |
          {
            echo "## No new release"
            echo ""
            echo "No new commits were found since the latest version tag."
          } >> "$GITHUB_STEP_SUMMARY"
